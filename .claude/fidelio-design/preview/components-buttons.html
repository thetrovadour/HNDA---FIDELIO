<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--bg);color:var(--text);font-family:var(--font-body);}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
.btn-p{background:var(--accent);color:#fff;padding:.75rem 1.75rem;border-radius:999px;font-weight:600;font-size:1rem;border:none;cursor:pointer;font-family:inherit}
.btn-o{background:transparent;border:1.5px solid var(--border);color:var(--text);padding:.75rem 1.75rem;border-radius:999px;font-weight:600;font-size:1rem;cursor:pointer;font-family:inherit}
.btn-ih{background:var(--bg);border:1.5px solid var(--accent);color:var(--text);padding:.75rem 1.75rem;border-radius:999px;font-weight:600;font-size:1rem;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:10px}
.arrow{display:inline-block;transition:transform .3s;color:var(--accent)}
.btn-ih:hover .arrow{transform:translateX(4px)}
.nav-cta{background:var(--accent);color:#fff;padding:.3rem .75rem;border-radius:999px;font-size:.75rem;font-weight:500;border:none;cursor:pointer;font-family:inherit}
.mobile-p{width:240px;padding:.75rem;border-radius:.75rem;background:rgba(255,255,255,.06);border:1px solid var(--border-hi);color:var(--text-hi);font-weight:600;letter-spacing:.08em;font-size:.85rem;text-align:center;cursor:pointer;font-family:inherit}
.lbl{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-right:12px;width:90px;display:inline-block}
</style></head><body>
<div class="row"><span class="lbl">Primary</span><button class="btn-p">Join Network</button><button class="btn-o">Back to HNDA</button></div>
<div class="row"><span class="lbl">Interactive</span><button class="btn-ih">Explore the Network <span class="arrow">→</span></button></div>
<div class="row"><span class="lbl">Nav CTA</span><button class="nav-cta">HNDA Nodes</button><button class="nav-cta">H-Wallets</button></div>
<div class="row"><span class="lbl">Mobile app</span><button class="mobile-p">ACCEDER</button></div>
</body></html>
