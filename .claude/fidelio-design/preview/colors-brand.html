<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--bg);color:var(--text);font-family:var(--font-body);}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.card{border-radius:16px;border:1.5px solid var(--border);padding:18px;background:var(--card-bg);}
.chip{display:inline-flex;align-items:center;gap:10px;margin-bottom:10px;}
.dot{width:14px;height:14px;border-radius:50%;}
.name{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);}
.big{font-family:var(--font-stencil);font-size:2rem;letter-spacing:.06em;line-height:1;}
.mono{font-family:ui-monospace,monospace;font-size:.72rem;color:var(--muted-hi);margin-top:6px;}
.usage{font-size:.78rem;color:var(--muted);margin-top:8px;line-height:1.5;}
</style></head><body>
<div class="grid">
<div class="card" style="border-color:var(--accent)"><div class="chip"><span class="dot" style="background:var(--accent)"></span><span class="name">Accent · HNDA</span></div><div class="big" style="color:var(--accent)">HNDA</div><div class="mono">#0ea5e9 · sky-500</div><div class="usage">CTAs, links, active states, eyebrow labels, primary-button fill.</div></div>
<div class="card" style="border-color:var(--gold)"><div class="chip"><span class="dot" style="background:var(--gold)"></span><span class="name">Gold · FIDELIO</span></div><div class="big" style="color:var(--gold)">FIDELIO</div><div class="mono">#c8a84b · mobile #C9A84C</div><div class="usage">CATR amounts, token icon stroke, balance display, financial data.</div></div>
</div></body></html>
