<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--bg);color:var(--text);font-family:var(--font-body);}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.lbl{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;width:110px;flex-shrink:0}
.status{padding:.3rem .85rem;border-radius:999px;font-size:.72rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;letter-spacing:.04em}
.live{background:rgba(34,197,94,.15);color:var(--success);border:1px solid rgba(34,197,94,.3)}
.cs{background:rgba(255,255,255,.08);color:var(--muted)}
.network{background:rgba(14,165,233,.1);color:var(--accent);border:1px solid rgba(14,165,233,.3)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--success);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.role{display:inline-flex;align-items:center;gap:8px;background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.25);padding:6px 14px;border-radius:999px;font-size:.82rem;color:var(--gold);font-weight:600;}
.role-dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.nav-pill{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:6px 14px;font-size:.75rem;color:var(--muted-hi);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.nav-pill.active{background:var(--accent);color:#fff;border-color:transparent}
</style></head><body>
<div class="row"><span class="lbl">Status</span><span class="status live"><span class="dot"></span>Live on Testnet</span><span class="status cs">Coming Soon</span><span class="status network"><span class="dot" style="background:var(--accent)"></span>Polygon · Base</span></div>
<div class="row"><span class="lbl">Role chips</span><span class="role"><span class="role-dot"></span>Usuario</span><span class="role" style="color:#6366f1;border-color:rgba(99,102,241,.25);background:rgba(99,102,241,.08)"><span class="role-dot" style="background:#6366f1"></span>Comerciante</span></div>
<div class="row"><span class="lbl">Segmented</span><span class="nav-pill active">General</span><span class="nav-pill">Seguridad</span><span class="nav-pill">Notificaciones</span></div>
</body></html>
