<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--bg);color:var(--text);font-family:var(--font-body);display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.box{background:var(--card-bg);border:1.5px solid var(--border);border-radius:16px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:140px}
.box.light{background:#fff;color:#111}
.hnda{font-family:var(--font-stencil);font-size:2.2rem;font-weight:800;letter-spacing:.06em;color:var(--accent)}
.fidelio{font-family:var(--font-stencil);font-size:2.2rem;font-weight:800;letter-spacing:.06em;color:var(--gold)}
.sub{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
</style></head><body>
<div class="box"><span class="hnda">HNDA</span><span class="sub">Dark · Sky accent</span></div>
<div class="box light"><span style="font-family:var(--font-stencil);font-size:2.2rem;font-weight:800;letter-spacing:.06em;color:#0ea5e9">HNDA</span><span class="sub" style="color:#888">Light variant</span></div>
<div class="box"><span class="fidelio">FIDELIO</span><span class="sub">Gold · Loyalty brand</span></div>
</body></html>
