<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--bg);color:var(--text);font-family:var(--font-body);}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
.sw{border-radius:12px;border:1.5px solid var(--border);padding:14px;height:120px;display:flex;flex-direction:column;justify-content:space-between;}
.sw .n{font-size:.7rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:700;}
.sw .v{font-family:ui-monospace,monospace;font-size:.72rem;color:var(--muted-hi);}
.sw .l{font-size:.8rem;color:var(--text);font-weight:600;}
</style></head><body>
<div class="row">
<div class="sw" style="background:#0a0f14"><div><div class="n">bg</div><div class="l">Page</div></div><div class="v">#0a0f14</div></div>
<div class="sw" style="background:#0C1018"><div><div class="n">surface</div><div class="l">Card (app)</div></div><div class="v">#0C1018</div></div>
<div class="sw" style="background:#111820"><div><div class="n">surface-hi</div><div class="l">Elevated</div></div><div class="v">#111820</div></div>
<div class="sw" style="background:rgba(255,255,255,0.04);border-color:var(--border-hi)"><div><div class="n">card-bg</div><div class="l">Glass</div></div><div class="v">rgba(255,255,255,.04)</div></div>
<div class="sw" style="background:rgba(255,255,255,0.08)"><div><div class="n">border</div><div class="l">Divider</div></div><div class="v">rgba(255,255,255,.08)</div></div>
</div></body></html>
