<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:var(--font-body);}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.t{border:1.5px solid var(--border);border-radius:12px;padding:16px;background:var(--card-bg);}
.lbl{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.v{font-family:ui-monospace,monospace;font-size:1.1rem;color:var(--accent);font-weight:700}
.d{font-size:.72rem;color:var(--muted);margin-top:6px;line-height:1.4}
</style></head><body>
<div class="grid">
<div class="t"><div class="lbl">Max content</div><div class="v">960px</div><div class="d">Standard section width</div></div>
<div class="t"><div class="lbl">Max hero</div><div class="v">1100px</div><div class="d">Hero + FIDELIO actors</div></div>
<div class="t"><div class="lbl">Section pad</div><div class="v">5rem 2rem</div><div class="d">Vertical · horizontal</div></div>
<div class="t"><div class="lbl">Nav height</div><div class="v">64px</div><div class="d">Fixed, glass, blur(12)</div></div>
<div class="t"><div class="lbl">Grid gap</div><div class="v">1.5rem</div><div class="d">Cards, repeat(auto-fit,280px)</div></div>
<div class="t"><div class="lbl">Card pad</div><div class="v">2rem</div><div class="d">Inner padding</div></div>
</div></body></html>
