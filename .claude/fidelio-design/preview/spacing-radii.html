<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--bg);color:var(--text);font-family:var(--font-body);}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.box{border:1.5px solid var(--border);background:var(--card-bg);padding:14px;display:flex;flex-direction:column;justify-content:space-between;height:110px;}
.lbl{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;}
.val{font-family:ui-monospace,monospace;font-size:.85rem;color:var(--text-hi)}
.usage{font-size:.72rem;color:var(--muted);line-height:1.4}
</style></head><body>
<div class="row">
<div class="box" style="border-radius:999px;padding:14px 22px"><div><div class="lbl">Pill</div><div class="val">999px</div></div><div class="usage">Buttons · badges</div></div>
<div class="box" style="border-radius:16px"><div><div class="lbl">Card</div><div class="val">16px</div></div><div class="usage">Product cards</div></div>
<div class="box" style="border-radius:12px"><div><div class="lbl">Mobile</div><div class="val">12px</div></div><div class="usage">App sub-cards</div></div>
<div class="box" style="border-radius:8px"><div><div class="lbl">Input</div><div class="val">8px</div></div><div class="usage">Form fields only</div></div>
</div></body></html>
