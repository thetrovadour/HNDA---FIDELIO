<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--bg);color:var(--text);font-family:var(--font-body);display:grid;grid-template-columns:1fr 1fr;gap:16px}
.product-card{background:rgba(255,255,255,.04);border:1.5px solid var(--border-hi);border-radius:16px;padding:1.4rem;transition:all .3s}
.product-card:hover{background:rgba(255,255,255,.06);border-color:rgba(14,165,233,.3);transform:translateY(-2px)}
.eyebrow{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
.title{font-weight:700;font-size:1.15rem;margin:0 0 6px;color:var(--text-hi);letter-spacing:-.01em}
.desc{color:var(--muted-hi);font-size:.85rem;line-height:1.55;margin:0}
.status{display:inline-flex;align-items:center;gap:6px;padding:.22rem .7rem;border-radius:999px;font-size:.65rem;font-weight:600;margin-bottom:10px;background:rgba(34,197,94,.14);color:var(--success);letter-spacing:.04em}
.dot{width:5px;height:5px;border-radius:50%;background:var(--success)}
.bal-card{background:linear-gradient(135deg,rgba(201,168,76,.08),rgba(255,255,255,.02));border:1px solid rgba(201,168,76,.2);border-radius:12px;padding:18px;color:#fff}
.bal-lbl{font-size:.7rem;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.bal-val{font-size:2rem;font-weight:200;letter-spacing:-.02em;color:var(--gold)}
.bal-sub{font-size:.7rem;color:var(--muted);margin-top:6px;letter-spacing:.04em}
</style></head><body>
<div class="product-card">
  <div class="eyebrow">H-Wallet</div>
  <div class="status"><span class="dot"></span>LIVE ON TESTNET</div>
  <h4 class="title">Non-custodial Honduran wallet</h4>
  <p class="desc">Sovereign keys, self-custody, local-first. The front door to HNDA.</p>
</div>
<div class="bal-card">
  <div class="bal-lbl">BALANCE CATR</div>
  <div class="bal-val">56,203.19 <span style="font-size:.9rem;color:var(--muted-hi);font-weight:300">pts</span></div>
  <div class="bal-sub">Saldo disponible · 1 pt ≈ 1 HNL</div>
</div>
</body></html>
