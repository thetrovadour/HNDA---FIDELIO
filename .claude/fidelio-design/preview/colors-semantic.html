<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--bg);color:var(--text);font-family:var(--font-body);}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.b{display:inline-flex;align-items:center;gap:8px;padding:.35rem .85rem;border-radius:999px;font-size:.78rem;font-weight:700;letter-spacing:.04em;}
.d{width:8px;height:8px;border-radius:50%;display:inline-block;}
.mono{font-family:ui-monospace,monospace;font-size:.7rem;color:var(--muted-hi);}
h5{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:0 0 10px}
.card{background:var(--card-bg);border:1.5px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:10px;}
</style></head><body>
<div class="card"><h5>Status badges</h5><div class="row">
<span class="b" style="background:var(--success-bg);color:var(--success)"><span class="d" style="background:var(--success)"></span>Live · Testnet</span>
<span class="b" style="background:var(--coming-soon-bg);color:var(--muted)">Coming Soon</span>
<span class="b" style="background:var(--error-bg);color:var(--error);border:1px solid rgba(239,68,68,.3)">Error</span>
<span class="b" style="background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold-border)">Usuario</span>
</div></div>
<div class="card"><h5>Tokens</h5><div class="row"><span class="mono">success #22c55e</span> · <span class="mono">error #EF4444</span> · <span class="mono">success-mobile #10B981</span> · <span class="mono">role-hnda #6366f1</span></div></div>
</body></html>
