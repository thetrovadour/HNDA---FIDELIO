<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);position:relative;overflow:hidden;height:300px}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 25% 40%,rgba(14,165,233,.15),transparent 50%),radial-gradient(ellipse at 75% 60%,rgba(14,165,233,.08),transparent 50%),linear-gradient(180deg,#0a0f14 0%,#0f1419 100%);}
.grid-lines{position:absolute;inset:0;background-image:linear-gradient(rgba(14,165,233,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(14,165,233,0.04) 1px,transparent 1px);background-size:32px 32px;mask-image:radial-gradient(ellipse at center,black 30%,transparent 70%);}
.content{position:relative;padding:40px;display:flex;flex-direction:column;gap:20px;height:100%;justify-content:center}
.lbl{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:10px}
.lbl::before{content:"";width:20px;height:1px;background:var(--accent)}
h2{font-family:var(--font-body);font-size:2.2rem;font-weight:900;letter-spacing:-.03em;margin:0;line-height:1}
.accent{color:var(--accent)}
.glow{text-shadow:0 0 40px rgba(14,165,233,.35)}
</style></head><body>
<div class="bg"></div><div class="grid-lines"></div>
<div class="content">
<span class="lbl">Visual Motifs · Networked glow · Radial gradient · Thin grid</span>
<h2 class="glow">Sovereign by design.<br><span class="accent">Nativa by mandate.</span></h2>
<p style="margin:0;color:var(--muted-hi);font-size:.85rem;max-width:420px;line-height:1.6">Dark voids + soft sky glow + faint grid = "Digital Answers" visual language. Used on hero sections, mission statements, product pages.</p>
</div></body></html>
