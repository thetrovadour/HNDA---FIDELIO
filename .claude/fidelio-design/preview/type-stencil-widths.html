<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--bg);color:var(--text);font-family:var(--font-body);}
h5{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 14px}
.row{display:flex;align-items:baseline;gap:14px;padding:10px 0;border-bottom:1px solid var(--border);}
.meta{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);width:130px;font-weight:700;flex-shrink:0;}
.stencil{color:var(--gold);letter-spacing:.06em;font-size:2.2rem;line-height:1;}
@font-face{font-family:'SairaStencilUltraCondensed';src:url('../fonts/SairaStencil_UltraCondensed-Black.ttf') format('truetype');font-weight:900}
@font-face{font-family:'SairaStencilCondensed';src:url('../fonts/SairaStencil_Condensed-Black.ttf') format('truetype');font-weight:900}
@font-face{font-family:'SairaStencilSemiCondensed';src:url('../fonts/SairaStencil_SemiCondensed-Black.ttf') format('truetype');font-weight:900}
@font-face{font-family:'SairaStencilSemiExpanded';src:url('../fonts/SairaStencil_SemiExpanded-Black.ttf') format('truetype');font-weight:900}
@font-face{font-family:'SairaStencilExpanded';src:url('../fonts/SairaStencil_Expanded-Black.ttf') format('truetype');font-weight:900}
</style></head><body>
<h5>Stencil family · width axis · 900 weight</h5>
<div class="row"><span class="meta">Ultra Condensed</span><span class="stencil" style="font-family:'SairaStencilUltraCondensed'">FIDELIO HNDA</span></div>
<div class="row"><span class="meta">Condensed</span><span class="stencil" style="font-family:'SairaStencilCondensed'">FIDELIO HNDA</span></div>
<div class="row"><span class="meta">Semi Condensed</span><span class="stencil" style="font-family:'SairaStencilSemiCondensed'">FIDELIO HNDA</span></div>
<div class="row"><span class="meta">Normal (default)</span><span class="stencil" style="font-family:'SairaStencil';font-weight:900">FIDELIO HNDA</span></div>
<div class="row"><span class="meta">Semi Expanded</span><span class="stencil" style="font-family:'SairaStencilSemiExpanded'">FIDELIO HNDA</span></div>
<div class="row"><span class="meta">Expanded</span><span class="stencil" style="font-family:'SairaStencilExpanded'">FIDELIO HNDA</span></div>
</body></html>
