<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--bg);color:var(--text);font-family:var(--font-body);display:flex;gap:24px;align-items:center;}
.card{flex:1;background:var(--surface);border:1px solid rgba(201,168,76,0.2);border-radius:12px;padding:16px;}
.n{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
.bal{font-size:3rem;line-height:1;font-weight:200;color:var(--text-hi);letter-spacing:-.02em;}
.unit{font-size:1rem;font-weight:300;color:var(--muted-hi);margin-left:6px;}
.sub{font-size:.65rem;letter-spacing:.08em;color:var(--muted);margin-top:8px}
.stat{font-family:var(--font-body);font-size:2.5rem;font-weight:900;letter-spacing:-.04em;color:var(--gold)}
.gold{color:var(--gold);}
</style></head><body>
<div class="card"><div class="n">Balance CATR</div><div><span class="bal"><span class="shimmer-text">56,203.19</span></span><span class="unit">pts</span></div><div class="sub">Saldo disponible · 1 pt = 1 HNL</div></div>
<div class="card" style="text-align:center"><div class="stat">50M</div><div class="n" style="margin-top:6px">Supply cap</div><div class="sub" style="letter-spacing:.04em">Revolving closed loop</div></div>
</body></html>
