<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HNDA · Web UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: #080C14; }
  ::-webkit-scrollbar-thumb { background: #1E2A40; border-radius: 5px; }
  main { padding-top: 64px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Nav.jsx" data-presets="react"></script>
<script type="text/babel" src="Hero.jsx" data-presets="react"></script>
<script type="text/babel" src="MissionCards.jsx" data-presets="react"></script>
<script type="text/babel" src="ProductGrid.jsx" data-presets="react"></script>
<script type="text/babel" src="Footer.jsx" data-presets="react"></script>

<script type="text/babel" data-presets="react">
function App() {
  return (
    <>
      <Nav />
      <main data-screen-label="HNDA.io — Marketing Site">
        <Hero />
        <MissionCards />
        <ProductGrid />
        <Footer />
      </main>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
